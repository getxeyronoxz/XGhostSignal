[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xghostsignal"
version = "0.1.0"
description = "A local-first OSINT and cellular intelligence workbench"
authors = [
    { name = "Xeyronox" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "networkx>=3.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0.0",
    "phonenumbers>=8.13.0",
    "pyrtlsdr>=0.3.0",
    "scapy>=2.5.0",
    "ollama>=0.1.0"
]
requires-python = ">=3.9"

[project.scripts]
xgs = "cli_app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["core", "cli_app", "services", "api", "plugins", "parsers"]
