[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xghostsignal"
version = "0.2.0"
description = "Local-first OSINT and Cellular Intelligence Workbench - A secure, offline tool for cell tower mapping, phone number intelligence, RF signal detection, and entity correlation"
authors = [
    { name = "xeyronox", email = "263518006+getxeyronoxz@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = [
    "osint",
    "sigint",
    "cell-tower",
    "gsm",
    "lte",
    "5g",
    "rf-spectrum",
    "rtl-sdr",
    "ads-b",
    "geospatial",
    "forensics",
    "security",
    "network-analysis",
    "local-first"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities"
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "networkx>=3.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0.0",
    "phonenumbers>=8.13.0",
    "pyrtlsdr>=0.3.0",
    "scapy>=2.5.0",
    "ollama>=0.1.0"
]
requires-python = ">=3.9"

[project.scripts]
xgs = "cli_app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["core", "cli_app", "services", "api", "plugins", "parsers"]
